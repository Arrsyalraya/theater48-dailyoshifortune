width:42px;

input,select,button{

button:hover{

transform:translateY(-3px);

box-shadow:

0 0 25px rgba(255,49,92,.45);

.status{

.profile-header{

.profile-header img{

.profile-header h3{

.profile-header p{

.member-badge{

.member-expiry{

.dashboard-grid{

grid-template-columns:360px 1fr;

gap:30px;

}

.left-column{

gap:20px;

}

.right-column{

display:flex;

}

.member-card{

background:#171717;

padding:25px;

}

.member-info{

display:flex;

justify-content:space-between;

}

.member-info span{

color:#999;

}

.member-info b{

}

.countdown-card{

background:linear-gradient(135deg,#ff2b2b,#6f0018);

padding:30px;

border-radius:18px;

}

.countdown-card h3{

margin-top:0;

}

#countdown{

font-size:36px;

font-weight:700;

margin-top:15px;

}

.quick-menu{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:15px;

}

.menu-box{

background:#181818;

padding:20px;

border-radius:15px;

text-align:center;

cursor:pointer;

}

.menu-box:hover{

transform:translateY(-5px);

}

.menu-box{

font-size:32px;

}

.menu-box p{

margin-top:10px;

font-size:15px;

}

.dash-line{

margin:45px 0;

border:1px solid #222;

</style>
</head>

  placeholder="Link foto profil">

<script>
const SUPABASE_URL = "https://cwxmnmwvlarjnxotfove.supabase.co";
const SUPABASE_KEY = "sb_publishable_svSvzN6AhV2zTfoHIte9ng_GUm7DUyB";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function register(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signUp({ email, password });

  if(error){
    alert(error.message);
    return;
  }

  alert("Akun berhasil dibuat. Cek email kalau diminta verifikasi.");
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if(error){
    alert(error.message);
    return;
  }

  loadDashboard();
}

async function loadDashboard(){
  const { data:{ user } } = await db.auth.getUser();

  if(!user) return;

  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("dashboardBox").classList.remove("hidden");
  document.getElementById("userEmail").innerText = user.email;

  let { data: profile } = await db
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(!profile){
    await db.from("profiles").insert({
      id:user.id,
      email:user.email,
      name:"",
      oshi:"",
      membership_status:"inactive"
    });

    profile = {
      name:"",
      oshi:"",
      membership_status:"inactive",
      membership_expired:null
    };
  }

  document.getElementById("name").value = profile.name || "";
  document.getElementById("avatar").value =
  profile.avatar_url || "";

  document.getElementById("profileName").innerText =
  profile.name || "Member";

  if(profile.avatar_url){
    document.getElementById("profileAvatar").src =
    profile.avatar_url;
}
  document.getElementById("oshi").value = profile.oshi || "";
  document.getElementById("memberStatus").innerText = profile.membership_status || "inactive";
  document.getElementById("memberExpired").innerText = profile.membership_expired || "-";
}

async function saveProfile(){
  const { data:{ user } } = await db.auth.getUser();

  if(!user) return;

  const name = document.getElementById("name").value;
  const oshi = document.getElementById("oshi").value;
  const avatar_url =
  document.getElementById("avatar").value;

  const { error } = await db
    .from("profiles")
    .update({ name, oshi, avatar_url })
    .eq("id", user.id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Profil berhasil disimpan.");
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

db.auth.getSession().then(({data})=>{
  if(data.session){
    loadDashboard();
  }
});
</script>
