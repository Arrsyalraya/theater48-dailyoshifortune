<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theater48Fight Member</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    color:white;

    background:
    radial-gradient(circle at top,#5d0d16 0%,#0b0b0b 45%),
    #0b0b0b;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}
.box{

width:100%;
max-width:460px;

background:rgba(20,20,20,.95);

border:1px solid rgba(255,255,255,.08);

border-radius:22px;

padding:35px;

box-shadow:

0 0 35px rgba(255,30,70,.15);

backdrop-filter:blur(18px);

}
input,select,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  box-sizing:border-box;
}
input,select{

background:#101010;

border:1px solid #2d2d2d;

color:white;

transition:.25s;

}

input:focus,
select:focus{

outline:none;

border-color:#ff315c;

box-shadow:0 0 15px rgba(255,49,92,.3);

}
button{

background:#ff315c;

color:white;

font-weight:600;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

box-shadow:

0 0 25px rgba(255,49,92,.45);

}
.hidden{display:none;}
.status{
  background:#222;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}
.profile-card{
    background:#1a1a1a;
    padding:18px;
    border-radius:16px;
    margin-bottom:20px;
}

.profile-header{
    display:flex;
    align-items:center;
    gap:14px;
}

.profile-header img{
    width:70px;
    height:70px;
    border-radius:50%;
    border:3px solid #ff2b2b;
}

.profile-header h3{
    margin:0;
    font-size:22px;
}

.profile-header p{
    margin:5px 0 0;
    color:#aaa;
}

.member-badge{
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    background:#2b1a1a;
}

.member-expiry{
    margin-top:10px;
    text-align:center;
    color:#bbb;
}
</style>
</head>

<body>

<div class="box" id="authBox">
  <div style="text-align:center;margin-bottom:25px;">

<h1 style="margin:0;color:#ff315c;">
Theater48Fight
</h1>

<p style="color:#aaa;margin-top:10px;">
Replay Theater JKT48 Premium
</p>

</div>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="register()">Daftar</button>
  <button onclick="login()">Login</button>
</div>

<div class="box hidden" id="dashboardBox">
  <h2>Dashboard Member</h2>

<div class="profile-card">

<div class="profile-header">

<img
id="profileAvatar"
src="https://ui-avatars.com/api/?background=ff2b2b&color=fff&name=Member">

<div>
<h3 id="profileName">Member</h3>
<p id="userEmail"></p>
</div>

</div>

<div class="member-badge" id="memberBadge">
🔴 Inactive Member
</div>

<div class="member-expiry">
⏳ Membership Expired:
<span id="memberExpired">-</span>
</div>

</div>

  <input id="name" placeholder="Nama kamu">

  <select id="oshi">
    <option value="">Pilih Oshi Favorit</option>
    <option>Freya</option>
    <option>Christy</option>
    <option>Gracie</option>
    <option>Feni</option>
    <option>Gita</option>
    <option>Eli</option>
    <option>Muthe</option>
    <option>Lulu</option>
    <option>Marsha</option>
    <option>Kathrina</option>
    <option>Jessi</option>
    <option>Lyn</option>
    <option>Greesel</option>
    <option>Raisha</option>
    <option>Trisha</option>
    <option>Michie</option>
  </select>

  <input
  id="avatar"
  placeholder="Link foto profil">
  <button onclick="saveProfile()">Simpan Profil</button>
  <button onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://cwxmnmwvlarjnxotfove.supabase.co";
const SUPABASE_KEY = "sb_publishable_svSvzN6AhV2zTfoHIte9ng_GUm7DUyB";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function register(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signUp({ email, password });

  if(error){
    alert(error.message);
    return;
  }

  alert("Akun berhasil dibuat. Cek email kalau diminta verifikasi.");
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if(error){
    alert(error.message);
    return;
  }

  loadDashboard();
}

async function loadDashboard(){
  const { data:{ user } } = await db.auth.getUser();

  if(!user) return;

  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("dashboardBox").classList.remove("hidden");
  document.getElementById("userEmail").innerText = user.email;

  let { data: profile } = await db
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(!profile){
    await db.from("profiles").insert({
      id:user.id,
      email:user.email,
      name:"",
      oshi:"",
      membership_status:"inactive"
    });

    profile = {
      name:"",
      oshi:"",
      membership_status:"inactive",
      membership_expired:null
    };
  }

  document.getElementById("name").value = profile.name || "";
  document.getElementById("avatar").value =
  profile.avatar_url || "";

  document.getElementById("profileName").innerText =
  profile.name || "Member";

  if(profile.avatar_url){
    document.getElementById("profileAvatar").src =
    profile.avatar_url;
}
  document.getElementById("oshi").value = profile.oshi || "";
  document.getElementById("memberStatus").innerText = profile.membership_status || "inactive";
  document.getElementById("memberExpired").innerText = profile.membership_expired || "-";
}

async function saveProfile(){
  const { data:{ user } } = await db.auth.getUser();

  if(!user) return;

  const name = document.getElementById("name").value;
  const oshi = document.getElementById("oshi").value;
  const avatar_url =
  document.getElementById("avatar").value;

  const { error } = await db
    .from("profiles")
    .update({ name, oshi, avatar_url })
    .eq("id", user.id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Profil berhasil disimpan.");
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

db.auth.getSession().then(({data})=>{
  if(data.session){
    loadDashboard();
  }
});
</script>

</body>
</html>
