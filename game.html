<div id="t48EmpireApp"></div>

<style>
#t48EmpireApp{
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(180deg,#241035,#11051c);
  padding:18px;
  border-radius:24px;
  max-width:1200px;
  margin:auto;
  overflow:hidden;
}
.t48-top{text-align:center;margin-bottom:15px}
.t48-title{font-size:34px;font-weight:900;color:#ff5bd7;text-shadow:0 0 18px #ff5bd7}
.t48-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:15px}
.t48-stat{background:rgba(255,255,255,.1);padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.15)}
.t48-stat b{font-size:22px;color:#ffe066}
.t48-layout{display:grid;grid-template-columns:260px 1fr;gap:15px}
.t48-panel,.t48-mapwrap{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px}
.t48-shop{display:grid;gap:10px}
.t48-shop button{
  background:linear-gradient(135deg,#ff4fd8,#7b2cff);
  border:0;color:white;border-radius:15px;padding:12px;text-align:left;font-weight:800;cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.25)
}
.t48-shop button.active{outline:3px solid #ffe066}
.t48-shop small{display:block;font-weight:400;opacity:.9;margin-top:4px}
.t48-map{
  position:relative;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  min-height:560px;
  background:
    linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%),
    linear-gradient(-45deg,rgba(255,255,255,.04) 25%,transparent 25%),
    linear-gradient(180deg,#403050,#241c33);
  background-size:28px 28px;
  padding:12px;
  border-radius:20px;
}
.t48-plot{
  height:120px;
  background:linear-gradient(180deg,#2e8b57,#1f5e3b);
  border:2px dashed rgba(255,255,255,.25);
  border-radius:18px;
  position:relative;
  cursor:pointer;
  overflow:hidden;
}
.t48-plot:before{
  content:"";
  position:absolute;inset:auto 8px 8px 8px;height:14px;
  background:rgba(0,0,0,.18);border-radius:50%;
}
.t48-empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.55);font-size:30px;
}
.t48-building{
  position:absolute;left:8px;right:8px;bottom:10px;height:85px;
  border-radius:14px 14px 8px 8px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:32px;font-weight:900;
  animation:pop .35s ease, glow 2s infinite alternate;
  box-shadow:0 -8px 25px rgba(255,91,215,.25);
}
.t48-building span{font-size:11px;margin-top:5px;background:rgba(0,0,0,.35);padding:3px 7px;border-radius:99px}
.stage{background:linear-gradient(180deg,#ff5bd7,#9125ff)}
.merch{background:linear-gradient(180deg,#ffb347,#ff4f70)}
.cafe{background:linear-gradient(180deg,#67e8f9,#246bfe)}
.photo{background:linear-gradient(180deg,#baff7b,#2bb673)}
.vip{background:linear-gradient(180deg,#ffe066,#b88900)}
.hall{background:linear-gradient(180deg,#ff7b7b,#7b1b1b)}
.t48-lv{
  position:absolute;top:7px;right:7px;background:#111;padding:4px 7px;border-radius:99px;font-size:11px;
}
.t48-upbtn{
  position:absolute;left:8px;right:8px;bottom:8px;
  border:0;border-radius:10px;padding:6px;background:#ffe066;color:#1c1028;font-weight:900;cursor:pointer;
  display:none;
}
.t48-plot:hover .t48-upbtn{display:block}
.float{
  position:absolute;
  color:#ffe066;
  font-weight:900;
  pointer-events:none;
  animation:floatUp 1s ease forwards;
  text-shadow:0 0 8px #000;
}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25)}}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-55px);opacity:0}}
@media(max-width:850px){
  .t48-layout{grid-template-columns:1fr}
  .t48-map{grid-template-columns:repeat(3,1fr);min-height:auto}
  .t48-plot{height:105px}
}
</style>

<script>
(() => {
const root = document.getElementById("t48EmpireApp");

const buildings = {
  stage:{name:"Main Stage", icon:"🎤", class:"stage", cost:100, income:2},
  merch:{name:"Merch Store", icon:"🛍️", class:"merch", cost:250, income:6},
  cafe:{name:"Idol Cafe", icon:"☕", class:"cafe", cost:500, income:14},
  photo:{name:"Photo Booth", icon:"📸", class:"photo", cost:900, income:30},
  vip:{name:"VIP Lounge", icon:"👑", class:"vip", cost:1800, income:70},
  hall:{name:"Concert Hall", icon:"🏟️", class:"hall", cost:4000, income:180}
};

let game = JSON.parse(localStorage.getItem("t48_empire_visual_v1")) || {
  coins:500,
  fans:0,
  level:1,
  exp:0,
  selected:"stage",
  plots:Array(24).fill(null)
};

function save(){
  localStorage.setItem("t48_empire_visual_v1",JSON.stringify(game));
}

function fmt(n){
  if(n>=1000000)return(n/1000000).toFixed(1)+"M";
  if(n>=1000)return(n/1000).toFixed(1)+"K";
  return Math.floor(n);
}

function income(){
  return game.plots.reduce((sum,p)=>{
    if(!p)return sum;
    return sum + buildings[p.id].income * p.lv;
  },0);
}

function addFloat(text){
  const map = document.querySelector(".t48-map");
  if(!map)return;
  const f=document.createElement("div");
  f.className="float";
  f.textContent=text;
  f.style.left=(40+Math.random()*70)+"%";
  f.style.top=(40+Math.random()*30)+"%";
  map.appendChild(f);
  setTimeout(()=>f.remove(),1000);
}

function needExp(){return game.level*150}

function addExp(x){
  game.exp+=x;
  while(game.exp>=needExp()){
    game.exp-=needExp();
    game.level++;
    game.coins+=game.level*100;
    addFloat("LEVEL UP!");
  }
}

function selectBuilding(id){
  game.selected=id;
  render();
  save();
}
window.t48SelectBuilding=selectBuilding;

function clickPlot(i){
  const plot=game.plots[i];

  if(!plot){
    const b=buildings[game.selected];
    if(game.coins<b.cost){
      addFloat("Coin kurang");
      return;
    }
    game.coins-=b.cost;
    game.plots[i]={id:game.selected,lv:1};
    game.fans+=20;
    addExp(40);
    addFloat("+ Bangunan!");
  }else{
    const gain=plot.lv*3;
    game.coins+=gain;
    game.fans+=1;
    addExp(2);
    addFloat("+"+gain+" coin");
  }

  render();
  save();
}
window.t48ClickPlot=clickPlot;

function upgradePlot(e,i){
  e.stopPropagation();
  const plot=game.plots[i];
  if(!plot)return;
  const cost=Math.floor(buildings[plot.id].cost*Math.pow(1.55,plot.lv));
  if(game.coins<cost){
    addFloat("Coin kurang");
    return;
  }
  game.coins-=cost;
  plot.lv++;
  game.fans+=50;
  addExp(70);
  addFloat("UPGRADE!");
  render();
  save();
}
window.t48UpgradePlot=upgradePlot;

function resetGame(){
  if(confirm("Reset game dari awal?")){
    localStorage.removeItem("t48_empire_visual_v1");
    location.reload();
  }
}
window.t48ResetVisual=resetGame;

function render(){
  const inc=income();
  const expPct=Math.min(100,(game.exp/needExp())*100);

  root.innerHTML=`
    <div class="t48-top">
      <div class="t48-title">THEATER48 EMPIRE</div>
      <p>Bangun theater impianmu. Pasang stage, cafe, merch store, VIP lounge, dan concert hall.</p>
    </div>

    <div class="t48-stats">
      <div class="t48-stat">Coins<br><b>🪙 ${fmt(game.coins)}</b></div>
      <div class="t48-stat">Fans<br><b>👥 ${fmt(game.fans)}</b></div>
      <div class="t48-stat">Income<br><b>+${fmt(inc)}/detik</b></div>
      <div class="t48-stat">Producer Lv<br><b>${game.level}</b></div>
    </div>

    <div style="background:#342044;border-radius:99px;overflow:hidden;margin-bottom:15px">
      <div style="width:${expPct}%;height:12px;background:linear-gradient(90deg,#ff5bd7,#ffe066)"></div>
    </div>

    <div class="t48-layout">
      <div class="t48-panel">
        <h3>🏗️ Build Menu</h3>
        <div class="t48-shop">
          ${Object.entries(buildings).map(([id,b])=>`
            <button onclick="t48SelectBuilding('${id}')" class="${game.selected===id?'active':''}">
              ${b.icon} ${b.name}
              <small>Cost ${fmt(b.cost)} coin · Income +${b.income}/detik</small>
            </button>
          `).join("")}
        </div>
        <br>
        <button onclick="t48ResetVisual()" style="width:100%;padding:10px;border:0;border-radius:12px;background:#444;color:white;font-weight:800">
          Reset Game
        </button>
      </div>

      <div class="t48-mapwrap">
        <h3>🏙️ Theater Area</h3>
        <div class="t48-map">
          ${game.plots.map((p,i)=>{
            if(!p){
              return `
                <div class="t48-plot" onclick="t48ClickPlot(${i})">
                  <div class="t48-empty">＋</div>
                </div>
              `;
            }
            const b=buildings[p.id];
            const cost=Math.floor(b.cost*Math.pow(1.55,p.lv));
            return `
              <div class="t48-plot" onclick="t48ClickPlot(${i})">
                <div class="t48-building ${b.class}">
                  ${b.icon}
                  <span>${b.name}</span>
                </div>
                <div class="t48-lv">Lv ${p.lv}</div>
                <button class="t48-upbtn" onclick="t48UpgradePlot(event,${i})">
                  Upgrade ${fmt(cost)}
                </button>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    </div>
  `;
}

setInterval(()=>{
  const inc=income();
  if(inc>0){
    game.coins+=inc;
    game.fans+=Math.floor(inc/5);
    addExp(Math.max(1,Math.floor(inc/12)));
    if(Math.random()<.35)addFloat("+"+fmt(inc)+" 🪙");
    render();
    save();
  }
},1000);

render();
})();
</script>
